# Cross-repository graph-json-contract check (Graphos AVI-1071, openspec
# change `split-graphos-studio` decision D4).
#
# The Haskell Graphos repository runs its binary over its test corpus in the
# `fixture` job of `.github/workflows/haskell.yml` and dispatches the real
# `graph.json` files here as a `graph-json-contract` repository event. This
# workflow embeds those files through `tests/generate-contract-fixtures.sh`
# (elm-test cannot read files at runtime) and decodes them with
# `tests/ContractTest.elm` — the same decoders `src/` uses — so a backend
# output change that breaks the studio fails this repository's CI.
#
# Non-dispatch runs (push, pull request, weekly schedule) pull the latest
# `graphos-fixture` artifact from jeremiepas/Graphos when the optional
# `GRAPHOS_CONTRACT_TOKEN` secret is configured. Without the secret they run
# the checked-in placeholder, which keeps the workflow green on forks and in
# fresh clones while still exercising the Elm suite.

name: Graphos contract

on:
  repository_dispatch:
    types: [graph-json-contract]
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/Studio/Data/Graph.elm"
      - "tests/**"
      - "elm.json"
      - ".github/workflows/contract.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/Studio/Data/Graph.elm"
      - "tests/**"
      - "elm.json"
      - ".github/workflows/contract.yml"
  schedule:
    # Weekly drift check even when neither repository changed.
    - cron: "23 5 * * 1"

concurrency:
  group: graphos-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Materialize the dispatched Haskell fixture
        if: github.event_name == 'repository_dispatch'
        run: |
          set -euo pipefail
          mkdir -p graphos-fixture
          jq -r '.client_payload.fixtures[] | [.name, .content] | @tsv' "$GITHUB_EVENT_PATH" |
            while IFS=$'\t' read -r name content; do
              printf '%s' "$content" | base64 --decode > "graphos-fixture/$name.graph.json"
            done
          test -n "$(find graphos-fixture -name '*.graph.json' -print -quit)"
          ls -l graphos-fixture
          jq -r '.client_payload | "source: \(.source_repo)@\(.sha) (\(.run_url))"' "$GITHUB_EVENT_PATH"
          echo "HAVE_FIXTURES=1" >> "$GITHUB_ENV"

      - name: Download the latest graphos-fixture artifact
        if: github.event_name != 'repository_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GRAPHOS_CONTRACT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::GRAPHOS_CONTRACT_TOKEN is not configured; running against the checked-in contract placeholder"
            echo "HAVE_FIXTURES=0" >> "$GITHUB_ENV"
            exit 0
          fi
          run_id=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/jeremiepas/Graphos/actions/workflows/haskell.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].id')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::no successful Graphos haskell.yml run found to source the fixture from"
            exit 1
          fi
          gh run download "$run_id" \
            --repo jeremiepas/Graphos \
            --name graphos-fixture \
            --dir graphos-fixture
          test -n "$(find graphos-fixture -name '*.graph.json' -print -quit)"
          ls -l graphos-fixture
          echo "HAVE_FIXTURES=1" >> "$GITHUB_ENV"

      - name: Generate contract fixtures (codegen pre-step)
        if: env.HAVE_FIXTURES == '1'
        run: tests/generate-contract-fixtures.sh graphos-fixture

      - name: Restore elm package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elm
          key: elm-${{ runner.os }}-${{ hashFiles('elm.json') }}

      # Same pinned-nixpkgs nix shell approach as studio.yml. This pin must
      # provide Elm 0.19.2 — elm.json requires it.
      - name: Contract test (elm-test)
        run: nix shell github:NixOS/nixpkgs/319e4cebef10cbb636c6ea392137b52ad105336a#elmPackages.elm github:NixOS/nixpkgs/319e4cebef10cbb636c6ea392137b52ad105336a#elmPackages.elm-test -c elm-test

      - name: Report the fixture source
        if: always()
        run: |
          echo "event: ${{ github.event_name }}"
          echo "fixtures present: ${HAVE_FIXTURES:-0}"
          if [ -d graphos-fixture ]; then
            ls -l graphos-fixture
          fi
