# AVI-1521: actions are pinned to full commit SHAs and permissions are
# least-privilege (the monorepo's scripts/check-workflow-pinning.sh that polices
# this stays in the Graphos repo; port it here when other workflows appear).
# Moved from the Graphos monorepo (`studio.yml`) as part of the
# `split-graphos-studio` change: the studio now lives at the root of this
# repository, so every path filter and working directory drops the `studio/`
# prefix, and the `if: github.actor == 'jeremiepas'` guard is gone — this
# repository's CI runs for every contributor, not just the monorepo owner.

name: Studio CI

# Graphos Studio (Elm SPA — openspec change `elm-graph-studio` in the Graphos
# repo). A failing studio build or test fails this repository's CI, which is
# independent of the Haskell Graphos repo's jobs.

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "public/**"
      - "assets/**"
      - "elm.json"
      - ".scripts/**"
      - "devenv.nix"
      - "devenv.yaml"
      - ".github/workflows/studio.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "public/**"
      - "assets/**"
      - "elm.json"
      - ".scripts/**"
      - "devenv.nix"
      - "devenv.yaml"
      - ".github/workflows/studio.yml"

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: Restore elm package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elm
          key: elm-${{ runner.os }}-${{ hashFiles('elm.json') }}

      # Pin must provide Elm 0.19.2 — elm.json requires it. The older
      # pin (d482ef84049d9b7276b83a06e4e4d76983830097) shipped elm 0.19.1,
      # which made every studio CI run fail at the version gate. Keep this
      # revision in sync with `devenv.yaml`.
      - name: Build (elm make --optimize)
        run: nix shell github:NixOS/nixpkgs/319e4cebef10cbb636c6ea392137b52ad105336a#elmPackages.elm -c elm make src/Main.elm --optimize --output=public/studio.js

      - name: Test (elm-test)
        run: nix shell github:NixOS/nixpkgs/319e4cebef10cbb636c6ea392137b52ad105336a#elmPackages.elm github:NixOS/nixpkgs/319e4cebef10cbb636c6ea392137b52ad105336a#elmPackages.elm-test -c elm-test

      - name: Fixture drift check (graph.json vs Fixtures.fixtureJson)
        run: .scripts/fixture-drift-check.sh

      - name: Token lint (no literal colors outside Tokens.elm)
        run: |
          # studio-design-system: every color literal lives in the Tokens
          # module; a hex color anywhere else in src/ fails CI.
          violations=$(grep -rnE '#[0-9a-fA-F]{6}' src/ --include='*.elm' | grep -v 'DesignSystem/Tokens.elm' || true)
          if [ -n "$violations" ]; then
            echo "Color literals outside Studio.DesignSystem.Tokens:" >&2
            echo "$violations" >&2
            exit 1
          fi
